[package]
name = "blockpad"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Document", "Window", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement", "KeyboardEvent", "Storage", "File", "FileList", "Event", "DragEvent", "DataTransfer", "Blob", "Url"] }
